! --- Externals Tool Reggie
MPI               = 1          , 1
externalbinary    = pyhope     , ./bin/piclas2vtk                                           ! Relative binary path in build directory
externaldirectory = pyhope.ini , parameter.ini                                              ! Directory name, where the files are located for the external tool reggie
externalruntime   = pre        , post                                                       ! Run after piclas is completed (post: after, pre: before)
cmd_suffix        =            , dsmc_reservoir_chemisty_off_State_000.00000500000000000.h5 ! Suffix for the binary execution

nocrosscombination:MPI,externalbinary,externaldirectory,externalruntime,cmd_suffix