! =============================================================================== !
! POSTI
! =============================================================================== !
IniExactFunc    = 0
! =============================================================================== !
! DISCRETIZATION
! =============================================================================== !
N               = 1
Nvisu           = 1
VisuParticles   = T
! =============================================================================== !
! DLOAD BALANCING
! =============================================================================== !
DoLoadBalance           = T
DoInitialAutoRestart    = F
Load-DeviationThreshold = 5e-2
LoadBalanceMaxSteps     = 10
UseH5IOLoadBalance      = T
! =============================================================================== !
! MESH
! =============================================================================== !
! MeshFile       = pre-hopr-SPT20/HET_SPT20_mesh.h5
MeshFile       = HET_SPT20_mesh.h5
TrackingMethod = triatracking
! =============================================================================== !
! OUTPUT / VISUALIZATION
! =============================================================================== !
ProjectName         = 2D_HET
doPrintStatusLine   = T
Part-AnalyzeStep    = 500
Surface-AnalyzeStep = 500
Field-AnalyzeStep   = 500
Part-IterationForMacroVal=5000

Particles-DSMC-CalcQualityFactors = T         ! pmax ... percent resolved
CalcSurfFluxInfo                  = T
CalcNumSpec                       = T
CalcNumDens                       = T
CalcElectronSEE                   = T

CalcHaloInfo            = T
CalcMeshInfo            = T
CalcPotentialEnergy     = T
CalcPartBalance         = T
PIC-OutputSource        = T
CalcTemp                = T
CalcPlasmaParameter     = T
CalcNumPlasmaParameter  = T
CalcDebyeLength         = T
CalcIonizationDegree    = T
CalcPlasmaFrequency     = T
CalcElectronIonDensity  = T
CalcElectronTemperature = T
CalcSurfaceImpact       = T

!Cyclotron Analyze Parameters
CalcPICTimeStepCyclotron = T
CalcCyclotronFrequency   = T

! PIC accuracy/stability parameters
CalcPICCFLCondition      = T
CalcMaxPartDisplacement  = T
CalcPICTimeStep          = T
CalcPointsPerDebyeLength = T

! =============================================================================== !
! CALCULATION
! =============================================================================== !
ManualTimeStep  = 2e-12
tend            = 2000e-12
Analyze_dt      = 1e-9
IterDisplayStep = 500
PrecondType     = 10
! =============================================================================== !
! PARTICLE Boundary Conditions
! =============================================================================== !
CalcBoundaryParticleOutput = T
BPO-NPartBoundaries        = 3
BPO-PartBoundaries         = (/1,2,6/)
BPO-NSpecies               = 3
BPO-Species                = (/2,3,4/)
! =============================================================================== !
! DSMC
! =============================================================================== !
UseDSMC                            = T
Particles-DSMC-CollisMode          = 3 !(1:elast coll, 2: elast + rela, 3:chem)
Part-NumberOfRandomSeeds           = 2
Particles-RandomSeed1              = 1
Particles-RandomSeed2              = 2
!Particles-DSMC-UseOctree           = T
!Particles-DSMC-UseNearestNeighbour = T
Particles-HaloEpsVelo              = 3E8
Part-WriteMacroValues              = T
Part-WriteMacroSurfaceValues       = T
Particles-DSMC-CalcSurfaceVal      = T
Particles-CollXSec-Database        = XSec_Database_Xe_Plasma-Biagi7-1.h5
Particles-CollXSec-NullCollision   = T

Particles-DSMC-ElectronicModel     = 3
Particles-DSMCElectronicDatabase   = Electronic-State-Database.h5
EpsMergeElectronicState            = 1E-2
Part-Species$-ElecRelaxProb        = 1.
! =============================================================================== !
! PIC
! =============================================================================== !
CalcEMFieldOutput         = T
PIC-Interpolation-Type    = particle_position
PIC-Deposition-Type       = cell_volweight_mean

! PIC-variableExternalField = B_Thruster.h5
PIC-AlgebraicExternalField      = 2 ! 2: 2D Liu 2010 magnetic + electric field, 3: 3D Liu 2010 magnetic + electric field
PIC-AlgebraicExternalFieldDelta = 2 ! Integer
! =============================================================================== !
! Field Boundaries
! =============================================================================== !
BoundaryName = BC_ANODE
BoundaryType = (/5,1/)           ! 5: Dirichlet, 1: Nbr of RefState
RefState     = (/200.0, 0.0, 0.0/) ! RefState Nbr 1: Voltage, Frequency and Phase shift 300-450

BoundaryName = BC_OUTLET
BoundaryType = (/10,0/)           ! or 4: Dirichlet with zero potential?

BoundaryName = BC_DIEANODE
BoundaryType = (/5,1/)

BoundaryName = BC_WALL
BoundaryType = (/4,0/)

BoundaryName = BC_z+
BoundaryType = (/10,0/)

BoundaryName = BC_z-
BoundaryType = (/10,0/)

BoundaryName = BC_SYMMETRY
BoundaryType = (/10,0/)
! =============================================================================== !
! Dielectric Region
! =============================================================================== !
DoDielectric         = T
DielectricNbrOfZones = 2
DielectricZoneID     = (/1,3/)
DielectricZoneEpsR   = (/3.8,3.8/) ! epsR = 2.5 - 3.78 https://www.sciencedirect.com/science/article/abs/pii/S027288421831513X
DielectricZoneMuR    = (/1.0,1.0/) !
! =============================================================================== !
! PARTICLE Boundary Condition
! =============================================================================== !
Part-nBounds              = 8

Part-Boundary1-SourceName = BC_ANODE
Part-Boundary1-Condition  = open

Part-Boundary2-SourceName = BC_OUTLET
Part-Boundary2-Condition  = open

Part-Boundary3-SourceName = BC_WALL          !adiabatic wall .... momentum acc
Part-Boundary3-Condition  = reflective

Part-Boundary4-SourceName = BC_z+
Part-Boundary4-Condition  = symmetric_dim

Part-Boundary5-SourceName = BC_z-
Part-Boundary5-Condition  = symmetric_dim

Part-Boundary6-SourceName = BC_DIELECTRIC
Part-Boundary6-Condition  = reflective
Part-Boundary6-Dielectric = T
Part-Boundary6-MomentumACC= 1.
Part-Boundary6-WallTemp   = 500.
Part-Boundary6-TransACC   = 1.
Part-Boundary6-VibACC     = 1.
Part-Boundary6-RotACC     = 1.
Part-Boundary6-ElecACC    = 1.
Part-Boundary6-SurfaceModel              = 13
Part-Species2-PartBound6-ResultSpec      = 2
Part-Species4-PartBound6-ResultSpec      = 2
Part-Boundary6-SurfModSEEFitCoeff        = (/2.016,299.0,0.563,0.0/)
Part-Boundary6-SurfModEnergyDistribution = cosine
Part-Boundary6-SurfMod-vMPF = T ! Enable the emission of a single secondary with a weighting factor scaled by the yield

Part-Boundary7-SourceName = BC_SYMMETRY
Part-Boundary7-Condition  = symmetric_axis

Part-Boundary8-SourceName = BC_DIEANODE
Part-Boundary8-Condition  = open
! =============================================================================== !
! SPECIES
! =============================================================================== !
Part-nSpecies=4
! =============================================================================== !
! Weighting Factor
! =============================================================================== !
Part-Species$-MacroParticleFactor   = 1e5

Part-vMPF                           = T
Part-Species$-vMPFMergeThreshold    = 150
Part-Species$-vMPFSplitThreshold    = 50
Part-vMPFSplitLimit                 = 100
! =============================================================================== !
! Species1 | Xe
! =============================================================================== !
Part-Species1-MassIC                      = 2.1801217412925434E-25
Part-Species1-ChargeIC                    = 0.0

Part-Species1-nInits                      = 1
Part-Species1-Init1-velocityDistribution  = maxwell_lpn
Part-Species1-Init1-SpaceIC               = background
Part-Species1-Init1-BGG-Distribution-SpeciesIndex = 1
Particles-BGGas-UseDistribution           = T
Particles-MacroscopicRestart-Filename     = pre-BGGas-2DAxisymmetric/2D_HET_DSMCState_000.001000.h5
! =============================================================================== !
! Species2 | e
! =============================================================================== !
Part-Species2-MassIC                      = 9.11E-31
Part-Species2-ChargeIC                    = -1.60217653E-19

Part-Species2-nInits                      = 1
Part-Species2-Init1-velocityDistribution  = maxwell_lpn
Part-Species2-Init1-SpaceIC               = cell_local
Part-Species2-Init1-PartDensity           = 1E16
Part-Species2-Init1-MWTemperatureIC       = 23209.05001233 ! 2 eV
Part-Species2-Init1-MinimalLocation       = (/  0, -999, -999. /)
Part-Species2-Init1-MaximalLocation       = (/  0.010,  999,  999. /)
! =============================================================================== !
! Species3 | XeIon1
! =============================================================================== !
Part-Species3-MassIC                      = 2.180113438597208E-25
Part-Species3-ChargeIC                    = 1.60217653E-19

Part-Species3-nInits                      = 1
Part-Species3-Init1-velocityDistribution  = maxwell_lpn
Part-Species3-Init1-SpaceIC               = cell_local
Part-Species3-Init1-PartDensity           = 1E16
Part-Species3-Init1-MWTemperatureIC       = 500.
Part-Species3-Init1-TempElec              = 500.
Part-Species3-Init1-MinimalLocation       = (/  0, -999, -999. /)
Part-Species3-Init1-MaximalLocation       = (/  0.010,  999,  999. /)
! =============================================================================== !
! Species6 | e
! =============================================================================== !
Part-Species4-MassIC                      = 9.11E-31
Part-Species4-ChargeIC                    = -1.60217653E-19

Part-Species4-nInits                      = 1
Part-Species4-Init1-SpaceIC               = cylinder
Part-Species4-Init1-velocityDistribution  = maxwell_lpn
Part-Species4-Init1-MWTemperatureIC       = 23209.05001233 ! 2 eV (paper 2016)
Part-Species4-Init1-ParticleEmissionType  = 1
Part-Species4-Init1-ParticleNumber        = 1.75E+13 ! calculated with 0.28A:0.28A/q/MPF with MPF=1e5
Part-Species4-Init1-BasePointIC           = (/ 0.010, 0.0, 0.0 /)
Part-Species4-Init1-BaseVector1IC         = (/ 0.0, 1.0, 0.0 /)
Part-Species4-Init1-BaseVector2IC         = (/ 0.0, 0.0, 1.0 /)
Part-Species4-Init1-NormalIC              = (/ 1.0, 0.0, 0.0 /)
Part-Species4-Init1-CylinderHeightIC      = 0.015
Part-Species4-Init1-RadiusIC              = 0.015
Part-Species4-Init1-VeloIC                = 0.0
Part-Species4-Init1-VeloVecIC             = (/0.,1.,0./)
! =============================================================================== !
! SYMMETRY
! =============================================================================== !
Particles-Symmetry-Order         = 2
Particles-Symmetry2DAxisymmetric = T