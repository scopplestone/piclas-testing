! L2 error norm
analyze_L2=2e4

! compare columns in a data file
compare_column_file            = PartAnalyze.csv       ! data file name
compare_column_reference_file  = PartAnalyze_ref.csv   ! reference data file name
compare_column_index           = 1                     ! columns index (starts at 0)
compare_column_tolerance_value = 1e-2                  ! tolerance
compare_column_tolerance_type  = relative              ! absolute or relative comparison

! hdf5 diff
h5diff_file             = cvwm_State_000.00000000010000000.h5              , cvwm_State_000.00000000010000000.h5
h5diff_reference_file   = ./pre-piclas/cvwm_State_000.00000000010000000.h5 , ./pre-piclas/cvwm_State_000.00000000010000000.h5
h5diff_data_set         = DG_Solution                                      , DG_Source
h5diff_tolerance_value  = 5e3                                              , 5e2
h5diff_tolerance_type   = absolute                                         , absolute
h5diff_max_differences  = 50                                               , 50