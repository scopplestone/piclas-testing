! hdf5 diff
h5diff_file            = CouetteFlow_DSMCState_001.000000.h5
h5diff_reference_file  = CouetteFlow_DSMCState_001.000000_ref.h5
h5diff_data_set        = ElemData
h5diff_tolerance_value = 0.01
h5diff_tolerance_type  = relative
h5diff_max_differences = 2000 ! Allowed differences for 6x100 velocities (x and z directions) and 3x100 vibrational temperatures and 2x3x100 HeatFlux+PressTens + 500 due to h5diff_allow_reorder
h5diff_one_diff_per_run = T
! Activate reordering the data set for varying space-filling curves. Note that the reference files cannot be converted to vtu using the new pyhope meshes.
h5diff_allow_reorder    = T