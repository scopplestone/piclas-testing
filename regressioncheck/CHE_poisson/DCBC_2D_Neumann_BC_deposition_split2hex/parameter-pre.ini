! =============================================================================== !
! EQUATION (linearscalaradvection)
! =============================================================================== !
IniExactFunc  = 0!800
DoCalcErrorNorms = T
OutputErrorNormsToH5 = T

! =============================================================================== !
! DISCRETIZATION
! =============================================================================== !
N             = 1
NMax          = 1
NVisu         = 1
pAdaptionType = 0
NVisuAdd = 1 ! p-adaption: increase of local polynomial degree used for the visualization by NVisuAdd
VisuParticles = T

! =============================================================================== !
! MESH
! =============================================================================== !
readFEMconnectivity = T
MeshFile      = mesh_Test_Split2Hex_mesh.h5
useCurveds    = F

! =============================================================================== !
! OUTPUT / VISUALIZATION
! =============================================================================== !
ProjectName = restart

! =============================================================================== !
! ANALYZE
! =============================================================================== !
IterDisplayStep     = 1
Part-AnalyzeStep    = 1
Field-AnalyzeStep   = 1
Surface-AnalyzeStep = 1
PIC-OutputSource = T

! =============================================================================== !
! Load Balance
! =============================================================================== !
DoLoadBalance = T
Load-DeviationThreshold = 1e-9
DoInitialAutoRestart = T
LoadBalanceMaxSteps = 5

! =============================================================================== !
! CALCULATION
! =============================================================================== !
ManualTimeStep = 0.05e-11
tend           = 1e-15
Analyze_dt     = 0.01e-10
OutputTimeFixed = 0.0
CalcNumSPec =T
CalcMeshInfo=T

! =============================================================================== !
! Field boundary conditions
! =============================================================================== !
BoundaryName = BC_LEFT
BoundaryType = (/30,0/)

BoundaryName = BC_RIGHT
BoundaryType = (/6,1/)                 ! Dirichlet with ExactFunc + Nbr of RefState (5: +-, 6: always positive)
RefState     = (/ -10.0 , 0.0 , 0.0 /) ! RefState Nbr 1: Voltage, Frequency and Phase shift

BoundaryName = BC_Zplus
BoundaryType = (/10,0/)

BoundaryName = BC_Zminus
BoundaryType = (/10,0/)

BoundaryName = BC_Xminus
BoundaryType = (/10,0/)

BoundaryName = BC_Yminus
BoundaryType = (/10,0/)

! =============================================================================== !
! Virtual Dielectric Layer
! =============================================================================== !
PIC-DoDirichletDeposition      = T ! default is True
PIC-Deposition-Type            = 12 ! cell_volweight_mean (12)
! Part-Boundary1-PermittivityVDL = 10.
! Part-Boundary1-ThicknessVDL    = 200e-9 ! 10.0e-9

!pAdaptionType=2 ! 2: set boundary elements to NMax

! =============================================================================== !
! HDG
! =============================================================================== !
PrecondType = 0
epsCG       = 1e-9

! =============================================================================== !
! PARTICLES
! =============================================================================== !

Part-nSpecies          = 2
Part-maxParticleNumber = 200000

! =============================================================================== !
! PARTICLE BOUNDARIES
! =============================================================================== !
Part-nBounds           = 6

! Additionally, the left BC is set to BCType=30 (DCBC)
Part-Boundary1-SourceName              = BC_LEFT
Part-Boundary1-Condition               = reflective
Part-Boundary1-UseSurfaceCharge        = T
Part-Boundary1-DC-BiasVoltage          = 0.0
Part-Boundary1-DC-Permittivity         = 10.0
Part-Boundary1-DC-SurfaceChargeDensity = 0.0
Part-Boundary1-DC-Thickness            = 200e-9

Part-Boundary2-SourceName = BC_RIGHT
Part-Boundary2-Condition  = open

Part-Boundary3-SourceName = BC_Zplus
Part-Boundary3-Condition  = symmetric

Part-Boundary4-SourceName = BC_Zminus
Part-Boundary4-Condition  = symmetric

Part-Boundary5-SourceName = BC_Xminus
Part-Boundary5-Condition  = symmetric

Part-Boundary6-SourceName = BC_Yminus
Part-Boundary6-Condition  = symmetric

! =============================================================================== !
! Species1
! =============================================================================== !
Part-Species1-ChargeIC            = 5e-10 ! 1D: 2.5e-11 ! calculated to acquire sigma = 1e-2 C/m2
Part-Species1-MassIC              = 1.0 ! make super heavy
Part-Species1-MacroParticleFactor = 1e-4

Part-Species1-nInits = 2

Part-Species1-Init1-SpaceIC              = cuboid
Part-Species1-Init1-velocityDistribution = maxwell_lpn
Part-Species1-Init1-MWTemperatureIC      = 100.!50000.0
Part-Species1-Init1-ParticleNumber       = 10000
Part-Species1-Init1-BasePointIC          = (/0.2500000001e-3 , -0.75e-3   , 0./)! Pauls 0.5 shifted grid
!Part-Species1-Init1-BasePointIC          = (/0.000000001e-3 , -0.5e-3   , 0./)

Part-Species1-Init1-BaseVector1IC        = (/0. , 0.5e-3 , 0./)
Part-Species1-Init1-BaseVector2IC        = (/0. , 0.   , 1e-4/)
Part-Species1-Init1-NormalIC             = (/1. , 0.   , 0./)
Part-Species1-Init1-CuboidHeightIC       = 1e-15
Part-Species1-Init1-VeloIC               = 1e8
Part-Species1-Init1-VeloVecIC            = (/-1.,0.,0./)


Part-Species1-Init2-SpaceIC              = cuboid
Part-Species1-Init2-velocityDistribution = maxwell_lpn
Part-Species1-Init2-MWTemperatureIC      = 100.!50000.0
Part-Species1-Init2-ParticleNumber       = 10000
Part-Species1-Init2-BasePointIC          = (/-0.25e-3, -0.2499999999e-3 , 0./) ! Pauls 0.5 shifted grid
!Part-Species1-Init2-BasePointIC          = (/-0.5e-3, 0.000000001e-3 , 0./)

Part-Species1-Init2-BaseVector1IC        = (/0.5e-3 , 0  , 0./)
Part-Species1-Init2-BaseVector2IC        = (/0.     , 0. , 1e-4/)
Part-Species1-Init2-NormalIC             = (/1.     , 0. , 0./)
Part-Species1-Init2-CuboidHeightIC       = 1e-15
Part-Species1-Init2-VeloIC               = 1e8
Part-Species1-Init2-VeloVecIC            = (/0.,-1.,0./)


! =============================================================================== !
! Species2 - constant background density 1e-4 C/m3
! =============================================================================== !
Part-Species2-ChargeIC            = -20. !-1.60217653E-19
Part-Species2-MassIC              = 1e9 ! immobile
Part-Species2-MacroParticleFactor = 2e-19

Part-Species2-nInits = 1

Part-Species2-Init1-SpaceIC              = cell_local
Part-Species2-Init1-velocityDistribution = maxwell
Part-Species2-Init1-PartDensity          = 1e-4
Part-Species2-Init1-VeloIC               = 0.1E5
Part-Species2-Init1-VeloVecIC            = (/1.,0.,0./)
Part-Species2-Init1-MWTemperatureIC      = 300.0