! =============================================================================== !
! DISCRETIZATION
! =============================================================================== !
N             = 1  ! Polynomial degree
NAnalyze      = 1  ! Number of analyze points
NVisu         = 1
! =============================================================================== !
! MESH
! =============================================================================== !
MeshFile      = cube_mesh.h5
useCurveds    = F
! if boundaries have to be changed (else they are used from Mesh directly):
TrackingMethod = triatracking
TriaSurfaceFlux = T
! =============================================================================== !
! OUTPUT / VISUALIZATION
! =============================================================================== !
ProjectName    = CircularInflow
IterDisplayStep = 1
CalcSurfFluxInfo = TRUE
TimeStampLength = 16
! =============================================================================== !
! CALCULATION
! =============================================================================== !
tend            = 2E-5
Analyze_dt      = 1E-5
ManualTimeStep  = 1E-5
! =============================================================================== !
! Load Balance
! =============================================================================== !
DoLoadBalance           = T
LoadBalanceMaxSteps     = 1
DoInitialAutoRestart    = T
Load-DeviationThreshold = 1E-9
! =============================================================================== !
! BOUNDARIES
! =============================================================================== !
Part-nBounds=6
Part-Boundary1-SourceName=BC_Xplus
Part-Boundary1-Condition=reflective
Part-Boundary2-SourceName=BC_Xminus
Part-Boundary2-Condition=reflective
Part-Boundary2-NbrOfSpeciesSwaps = 1
Part-Boundary2-SpeciesSwaps1     = (/1,0/)
Part-Boundary3-SourceName=BC_Yplus
Part-Boundary3-Condition=reflective
Part-Boundary4-SourceName=BC_Yminus
Part-Boundary4-Condition=reflective
Part-Boundary4-NbrOfSpeciesSwaps = 1
Part-Boundary4-SpeciesSwaps1     = (/1,0/)
Part-Boundary5-SourceName=BC_Zplus
Part-Boundary5-Condition=reflective
Part-Boundary6-SourceName=BC_Zminus
Part-Boundary6-Condition=reflective
Part-Boundary6-NbrOfSpeciesSwaps = 1
Part-Boundary6-SpeciesSwaps1     = (/1,0/)
! =============================================================================== !
! SPECIES
! =============================================================================== !
Particles-Species-Database = SpeciesDatabase.h5
Part-nSpecies=1
Part-Species1-SpeciesName = O2
Part-Species1-MacroParticleFactor=1E2

Part-Species1-nSurfaceFluxBCs=3

! Inlet: Constant mass flow, Type 3 at Xplus (BC=1)
Part-Species1-Surfaceflux1-BC=1
Part-Species1-Surfaceflux1-velocityDistribution=maxwell_lpn
Part-Species1-Surfaceflux1-VeloIC=10000.
Part-Species1-Surfaceflux1-VeloVecIC=(/-1.0,0.0,0.0/)
Part-Species1-Surfaceflux1-MWTemperatureIC=1.
Part-Species1-Surfaceflux1-Massflow=1E-13
Part-Species1-Surfaceflux1-CircularInflow=T
Part-Species1-Surfaceflux1-axialDir=1
Part-Species1-Surfaceflux1-origin=(/0.0005,0.0005/)
Part-Species1-Surfaceflux1-rmax=0.0002
Part-Species1-Surfaceflux1-rmin=0.0001
Part-Species1-Surfaceflux1-RacetrackLength=0.001
Part-Species1-Surfaceflux1-RacetrackDir=(/1.0,1.0/)       ! (y,z)

Part-Species1-Surfaceflux2-BC=3
Part-Species1-Surfaceflux2-velocityDistribution=maxwell_lpn
Part-Species1-Surfaceflux2-VeloIC=10000.
Part-Species1-Surfaceflux2-VeloVecIC=(/0.0,-1.0,0.0/)
Part-Species1-Surfaceflux2-MWTemperatureIC=1.
Part-Species1-Surfaceflux2-Massflow=1E-13
Part-Species1-Surfaceflux2-CircularInflow=T
Part-Species1-Surfaceflux2-axialDir=2
Part-Species1-Surfaceflux2-origin=(/0.0005,0.0005/)
Part-Species1-Surfaceflux2-rmax=0.0002
Part-Species1-Surfaceflux2-rmin=0.0001
Part-Species1-Surfaceflux2-RacetrackLength=0.001
Part-Species1-Surfaceflux2-RacetrackDir=(/1.0,0.0/)       ! (z,x)

Part-Species1-Surfaceflux3-BC=5
Part-Species1-Surfaceflux3-velocityDistribution=maxwell_lpn
Part-Species1-Surfaceflux3-VeloIC=10000.
Part-Species1-Surfaceflux3-VeloVecIC=(/0.0,0.0,-1.0/)
Part-Species1-Surfaceflux3-MWTemperatureIC=1.
Part-Species1-Surfaceflux3-Massflow=1E-13
Part-Species1-Surfaceflux3-CircularInflow=T
Part-Species1-Surfaceflux3-axialDir=3
Part-Species1-Surfaceflux3-origin=(/0.0005,0.0005/)
Part-Species1-Surfaceflux3-rmax=0.0002
Part-Species1-Surfaceflux3-rmin=0.0001
Part-Species1-Surfaceflux3-RacetrackLength=0.001
Part-Species1-Surfaceflux3-RacetrackDir=(/0.0,1.0/)       ! (x,y)
! =============================================================================== !
! DSMC
! =============================================================================== !
Particles-HaloEpsVelo=2.0E+03

Part-WriteMacroValues = T
Part-IterationForMacroVal = 2
Particles-DSMC-CalcSurfaceVal=true
UseDSMC=true
Particles-DSMC-CollisMode=0
Part-NumberOfRandomSeeds=2
Particles-RandomSeed1=1
Particles-RandomSeed2=2
Particles-DSMC-UseOctree=true
Particles-DSMC-UseNearestNeighbour = T
Particles-DSMC-CalcQualityFactors=F
CalcSurfaceImpact = F

Part-nSurfSample = 4
