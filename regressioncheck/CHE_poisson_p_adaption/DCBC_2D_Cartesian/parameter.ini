! =============================================================================== !
! EQUATION (linearscalaradvection)
! =============================================================================== !
IniExactFunc  = 800
DoCalcErrorNorms = T
OutputErrorNormsToH5 = F

! =============================================================================== !
! DISCRETIZATION
! =============================================================================== !
N             = 1
NMax          = 2
pAdaptionType = 1
NVisu = 1
NVisuAdd = 5 ! p-adaption: increase of local polynomial degree used for the visualization by NVisuAdd
VisuParticles = T

! =============================================================================== !
! MESH
! =============================================================================== !
readFEMconnectivity = T
MeshFile      = 2D_mortonZ_8_mesh.h5
useCurveds    = F

! =============================================================================== !
! OUTPUT / VISUALIZATION
! =============================================================================== !
ProjectName              = 1D_DCBC

! =============================================================================== !
! ANALYZE
! =============================================================================== !
IterDisplayStep     = 1
Part-AnalyzeStep    = 1
Field-AnalyzeStep   = 1
Surface-AnalyzeStep = 1
CalcNumSpec = T
CalcTemp = T
PIC-OutputSource = T

! =============================================================================== !
! CALCULATION
! =============================================================================== !
ManualTimeStep = 1.0e-14
Analyze_dt     = 1.0e-13
tend           = 1.0e-12

! =============================================================================== !
! Field boundary conditions
! =============================================================================== !
! Change boundary condition on wall from Neumann to Dirichlet with Phi = 0 V
BoundaryName = BC_RIGHT
BoundaryType = (/6,1/)                 ! Dirichlet with ExactFunc + Nbr of RefState (5: +-, 6: always positive)
RefState     = (/ -10.0 , 0.0 , 0.0 /) ! RefState Nbr 1: Voltage, Frequency and Phase shift

BoundaryName    = BC_LEFT
BoundaryType    = (/30,1/)          ! 30: DCBC with linear ramp 1st LinState
LinPhiBasePoint = (/0. , 0. , 0./) ! 1st LinState
LinPhiNormal    = (/0. , 1. , 0./) ! 1st LinState
LinPhiHeight    = 5e-5             ! 1st LinState
LinPhi          = 1e3              ! 1st LinState

! =============================================================================== !
! PIC
! =============================================================================== !
PIC-Deposition-Type = 12
PIC-DoInterpolation = F ! deactivate Lorentz force on particles as this can lead to artifacts in the deposition pattern (mesh imprint)

! =============================================================================== !
! PARTICLES
! =============================================================================== !
Part-nSpecies          = 1
! Part-maxParticleNumber = 20000

! =============================================================================== !
! PARTICLE BOUNDARIES
! =============================================================================== !
Part-nBounds           = 6

! Additionally, the left BC is set to BCType=30 (DCBC)
Part-Boundary1-SourceName = BC_LEFT
Part-Boundary1-Condition  = reflective
Part-Boundary1-UseSurfaceCharge = T
Part-Boundary1-DC-BiasVoltage          = 0.0
Part-Boundary1-DC-Permittivity         = 10.0
Part-Boundary1-DC-SurfaceChargeDensity = 0.0
Part-Boundary1-DC-Thickness            = 10e-9

Part-Boundary2-SourceName = BC_RIGHT
Part-Boundary2-Condition  = open

Part-Boundary3-SourceName = BC_symmetryy+
Part-Boundary3-Condition  = symmetric

Part-Boundary4-SourceName = BC_symmetryy-
Part-Boundary4-Condition  = symmetric

Part-Boundary5-SourceName = BC_periodicz+
Part-Boundary5-Condition  = periodic

Part-Boundary6-SourceName = BC_periodicz-
Part-Boundary6-Condition  = periodic

Part-nPeriodicVectors = 1

! =============================================================================== !
! Species1
! =============================================================================== !
Part-Species1-ChargeIC            = 2.5e-11 ! calculated to acquire sigma = 1e-2 C/m2
Part-Species1-MassIC              = 1e-22
Part-Species1-MacroParticleFactor = 1.0e-5

Part-Species1-nInits = 1

Part-Species1-Init1-SpaceIC              = cuboid
Part-Species1-Init1-velocityDistribution = maxwell_lpn
Part-Species1-Init1-MWTemperatureIC      = 1.0e15
Part-Species1-Init1-ParticleNumber       = 1000000
Part-Species1-Init1-BasePointIC          = (/2e-9  , 0.   , 0./)
Part-Species1-Init1-BaseVector1IC        = (/0. , 5e-5 , 0./)
Part-Species1-Init1-BaseVector2IC        = (/0. , 0.   , 5e-4/)
Part-Species1-Init1-NormalIC             = (/1. , 0.   , 0./)
Part-Species1-Init1-CuboidHeightIC       = 1e-12
Part-Species1-Init1-VeloIC               = 45e6
Part-Species1-Init1-VeloVecIC            = (/-1.,0.,0./)
