! =============================================================================== !
! POSTI
! =============================================================================== !
VisuParticles   = T
TimeStampLength = 10
! =============================================================================== !
! VARIABLES
! =============================================================================== !
N               = 1
Nvisu           = 1
! =============================================================================== !
! Load Balancing
! =============================================================================== !
DoLoadBalance           = T
DoInitialAutoRestart    = F
Load-DeviationThreshold = 5e-2
LoadBalanceMaxSteps     = 10
UseH5IOLoadBalance      = T
! =============================================================================== !
! MESH
! =============================================================================== !
MeshFile       = HET_SPT20_mesh.h5, HET_SPT20_gmsh_extruded_mesh.h5
TrackingMethod = triatracking
! =============================================================================== !
! OUTPUT / VISUALIZATION
! =============================================================================== !
ProjectName         = BGGas, BGGas_gmsh_extruded
nocrosscombination:MeshFile,ProjectName
doPrintStatusLine   = T
Part-AnalyzeStep    = 10
Surface-AnalyzeStep = 10
Field-AnalyzeStep   = 10
Part-IterationForMacroVal=100

Particles-DSMC-CalcQualityFactors = T
CalcSurfFluxInfo                  = T
CalcNumSpec                       = T
CalcNumDens                       = T

CalcBoundaryParticleOutput = T
BPO-NPartBoundaries        = 2        ! Nbr of boundaries
BPO-PartBoundaries         = (/1,2/)
BPO-NSpecies               = 1        ! Nbr of species
BPO-Species                = (/1/)    ! neutrals
! =============================================================================== !
! CALCULATION
! =============================================================================== !
ManualTimeStep  = 1e-6
tend            = 1e-3
Analyze_dt      = 1e-4
IterDisplayStep = 10
! =============================================================================== !
! DSMC
! =============================================================================== !
UseDSMC                            = T
Particles-DSMC-CollisMode          = 2 !(1:elast coll, 2: elast + rela, 3:chem)
Part-NumberOfRandomSeeds           = 2
Particles-RandomSeed1              = 1
Particles-RandomSeed2              = 2
Particles-DSMC-UseOctree           = T
Particles-DSMC-UseNearestNeighbour = T
Particles-HaloEpsVelo              = 1E6
Part-WriteMacroValues              = T
Particles-DSMC-CalcSurfaceVal      = T

Particles-DSMC-ElectronicModel     = 1
Particles-DSMCElectronicDatabase   = Electronic-State-Database.h5
EpsMergeElectronicState            = 1E-2
Particles-DSMC-ElecRelaxProb       = 1.
! =============================================================================== !
! PARTICLES
! =============================================================================== !
Part-nSpecies              = 1

Part-nBounds = 7

Part-Boundary1-SourceName = bc_anode
Part-Boundary1-Condition  = open

Part-Boundary2-SourceName = bc_outlet
Part-Boundary2-Condition  = open

Part-Boundary3-SourceName = bc_wall
Part-Boundary3-Condition  = reflective

Part-Boundary4-SourceName = bc_rotsym
Part-Boundary4-Condition  = symmetric_dim

Part-Boundary5-SourceName = bc_dielectric
Part-Boundary5-Condition  = reflective
Part-Boundary5-MomentumACC= 1.
Part-Boundary5-WallTemp   = 500.
Part-Boundary5-TransACC   = 1.
Part-Boundary5-VibACC     = 1.
Part-Boundary5-RotACC     = 1.
Part-Boundary5-ElecACC    = 1.

Part-Boundary6-SourceName = bc_symaxis
Part-Boundary6-Condition  = symmetric_axis

Part-Boundary7-SourceName = bc_dieanode
Part-Boundary7-Condition  = open
! =============================================================================== !
! WEIGHTING
! =============================================================================== !
Part-Species1-MacroParticleFactor = 1E9
! Radial Weighting
Part-Weight-Type               = radial
Part-Weight-Radial-ScaleFactor = 10
Part-Weight-CloneMode          = 2
Part-Weight-CloneDelay         = 10
! =============================================================================== !
! Species1 - Xe
! =============================================================================== !
Part-Species1-SpeciesName       = Xe
Part-Species1-MassIC            = 2.1801217412925434E-25
Part-Species1-ChargeIC          = 0.0
Part-Species1-InteractionID     = 1
Part-Species1-Tref              = 273
Part-Species1-dref              = 5.74E-10
Part-Species1-omega             = 0.35
Part-Species1-HeatOfFormation_K = 0.0

Part-Species1-nSurfaceFluxBCs = 1

Part-Species1-Surfaceflux1-BC = 1
Part-Species1-Surfaceflux1-velocityDistribution = maxwell_lpn
Part-Species1-Surfaceflux1-VeloIC               = 100.                                  !m/s
Part-Species1-Surfaceflux1-VeloVecIC            = (/1.0,0.0,0.0/)
Part-Species1-Surfaceflux1-MWTemperatureIC      = 500.
Part-Species1-Surfaceflux1-TempElec             = 500.
Part-Species1-Surfaceflux1-Adaptive             = T
Part-Species1-Surfaceflux1-Adaptive-Type        = 4
Part-Species1-Surfaceflux1-Adaptive-Massflow    = 1.0E-6

AdaptiveBC-SamplingIteration      = 100
AdaptiveBC-TruncateRunningAverage = T
! =============================================================================== !
! SYMMETRY
! =============================================================================== !
Particles-Symmetry-Order         = 2
Particles-Symmetry2DAxisymmetric = T