name: cmake-ninja

on:
  push:
  #pull_request:
  release:
    types: published

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/scopplestone/piclas-ci-appimage:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged

    steps:

    - name: Configure CMake PICLas Single-core
      shell: bash
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -G Ninja -B build_single -DPICLAS_INSTRUCTION=-mtune=generic -DCMAKE_BUILD_TYPE=Release -DLIBS_USE_MPI=OFF -DLIBS_BUILD_HDF5=ON -DPICLAS_BUILD_POSTI=ON -DPOSTI_BUILD_SUPERB=ON -DPICLAS_READIN_CONSTANTS=ON -DCMAKE_INSTALL_PREFIX=/usr

    - name: Build PICLas Single-core
      shell: bash
      run: cmake --build build_single

    - name: Configure CMake PICLas DSMC
      shell: bash
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -G Ninja -B build_DSMC -DPICLAS_INSTRUCTION=-mtune=generic -DPOSTI_BUILD_PICLAS2VTK=OFF -DPOSTI_BUILD_SUPERB=OFF -DPICLAS_POLYNOMIAL_DEGREE=1 -DPICLAS_TIMEDISCMETHOD=DSMC -DCMAKE_BUILD_TYPE=Release -DLIBS_USE_MPI=ON -DLIBS_BUILD_HDF5=OFF -DPICLAS_READIN_CONSTANTS=ON -DCMAKE_INSTALL_PREFIX=/usr

    - name: Build PICLas DSMC
      shell: bash
      run: cmake --build build_DSMC

    - name: Configure CMake PICLas BGK
      shell: bash
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -G Ninja -B build_BGK -DPICLAS_INSTRUCTION=-mtune=generic -DPOSTI_BUILD_PICLAS2VTK=OFF -DPOSTI_BUILD_SUPERB=OFF -DPICLAS_POLYNOMIAL_DEGREE=1 -DPICLAS_TIMEDISCMETHOD=BGK-Flow -DCMAKE_BUILD_TYPE=Release -DLIBS_USE_MPI=ON -DLIBS_BUILD_HDF5=OFF -DPICLAS_READIN_CONSTANTS=ON -DCMAKE_INSTALL_PREFIX=/usr

    - name: Build PICLas BGK
      shell: bash
      run: cmake --build build_BGK

    - name: Configure CMake PICLas FP
      shell: bash
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -G Ninja -B build_FP -DPICLAS_INSTRUCTION=-mtune=generic -DPOSTI_BUILD_PICLAS2VTK=OFF -DPOSTI_BUILD_SUPERB=OFF -DPICLAS_POLYNOMIAL_DEGREE=1 -DPICLAS_TIMEDISCMETHOD=FP-Flow -DCMAKE_BUILD_TYPE=Release -DLIBS_USE_MPI=ON -DLIBS_BUILD_HDF5=OFF -DPICLAS_READIN_CONSTANTS=ON -DCMAKE_INSTALL_PREFIX=/usr

    - name: Build PICLas FP
      shell: bash
      run: cmake --build build_FP

    - name: Configure CMake PICLas Poisson Leapfrog
      shell: bash
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -G Ninja -B build_poisson_leapfrog -DPICLAS_INSTRUCTION=-mtune=generic -DPOSTI_BUILD_PICLAS2VTK=OFF -DPOSTI_BUILD_SUPERB=ON -DPICLAS_TIMEDISCMETHOD=Leapfrog -DPICLAS_EQNSYSNAME=poisson -DLIBS_USE_PETSC=ON -DCMAKE_BUILD_TYPE=Release -DLIBS_USE_MPI=ON -DLIBS_BUILD_HDF5=OFF -DPICLAS_READIN_CONSTANTS=ON -DCMAKE_INSTALL_PREFIX=/usr

    - name: Build PICLas Poisson Leapfrog
      shell: bash
      run: cmake --build build_poisson_leapfrog

    - name: Create AppImages
      shell: bash
      run: |
        echo "======================================================================="
        ls -la build_single/bin
        echo "======================================================================="
        cd build_single

        # Declare an array of strings
        declare -a PROGS=("piclas2vtk")

        # Iterate the string array
        for PROG in ${PROGS[@]}; do
          rm -rf AppDir
          DESTDIR=AppDir ninja install
          mkdir -p AppDir/usr/share/icons
          cp ../docs/logo.png AppDir/usr/share/icons/${PROG}.png
          mkdir -p AppDir/usr/share/icons/hicolor/64x64/apps/
          ln -sf ../../../${PROG}.png AppDir/usr/share/icons/hicolor/64x64/apps/
          cp ../.github/workflows/piclas.desktop template.desktop
          mv template.desktop ${PROG}.desktop
          sed -i -e "s/Name=.*/Name=${PROG}/" ${PROG}.desktop
          sed -i -e "s/Exec=.*/Exec=${PROG}/" ${PROG}.desktop
          sed -i -e "s/Icon=.*/Icon=${PROG}/" ${PROG}.desktop
          linuxdeploy --appdir AppDir --output appimage --desktop-file=${PROG}.desktop
        done

        # Check folder contents
        ls -la
        cd ..


        echo "======================================================================="
        ls -la build_DSMC/bin
        echo "======================================================================="
        cd build_DSMC

        # Declare an array of strings
        declare -a PROGS=("piclas")

        # Iterate the string array
        for PROG in ${PROGS[@]}; do
          rm -rf AppDir
          DESTDIR=AppDir ninja install
          mkdir -p AppDir/usr/share/icons
          cp ../docs/logo.png AppDir/usr/share/icons/${PROG}.png
          mkdir -p AppDir/usr/share/icons/hicolor/64x64/apps/
          ln -sf ../../../${PROG}.png AppDir/usr/share/icons/hicolor/64x64/apps/
          cp ../.github/workflows/piclas.desktop template.desktop
          mv template.desktop ${PROG}.desktop
          sed -i -e "s/Name=.*/Name=${PROG}/" ${PROG}.desktop
          sed -i -e "s/Exec=.*/Exec=${PROG}/" ${PROG}.desktop
          sed -i -e "s/Icon=.*/Icon=${PROG}/" ${PROG}.desktop
          linuxdeploy --appdir AppDir --output appimage --desktop-file=${PROG}.desktop
        done

        # Check folder contents
        ls -la
        cd ..

        echo "======================================================================="
        ls -la build_BGK/bin
        echo "======================================================================="
        cd build_BGK

        # Declare an array of strings
        declare -a PROGS=("piclas")

        # Iterate the string array
        for PROG in ${PROGS[@]}; do
          rm -rf AppDir
          DESTDIR=AppDir ninja install
          mkdir -p AppDir/usr/share/icons
          cp ../docs/logo.png AppDir/usr/share/icons/${PROG}.png
          mkdir -p AppDir/usr/share/icons/hicolor/64x64/apps/
          ln -sf ../../../${PROG}.png AppDir/usr/share/icons/hicolor/64x64/apps/
          cp ../.github/workflows/piclas.desktop template.desktop
          mv template.desktop ${PROG}.desktop
          sed -i -e "s/Name=.*/Name=${PROG}/" ${PROG}.desktop
          sed -i -e "s/Exec=.*/Exec=${PROG}/" ${PROG}.desktop
          sed -i -e "s/Icon=.*/Icon=${PROG}/" ${PROG}.desktop
          linuxdeploy --appdir AppDir --output appimage --desktop-file=${PROG}.desktop
        done

        # Check folder contents
        ls -la
        cd ..

        echo "======================================================================="
        ls -la build_FP/bin
        echo "======================================================================="
        cd build_FP

        # Declare an array of strings
        declare -a PROGS=("piclas")

        # Iterate the string array
        for PROG in ${PROGS[@]}; do
          rm -rf AppDir
          DESTDIR=AppDir ninja install
          mkdir -p AppDir/usr/share/icons
          cp ../docs/logo.png AppDir/usr/share/icons/${PROG}.png
          mkdir -p AppDir/usr/share/icons/hicolor/64x64/apps/
          ln -sf ../../../${PROG}.png AppDir/usr/share/icons/hicolor/64x64/apps/
          cp ../.github/workflows/piclas.desktop template.desktop
          mv template.desktop ${PROG}.desktop
          sed -i -e "s/Name=.*/Name=${PROG}/" ${PROG}.desktop
          sed -i -e "s/Exec=.*/Exec=${PROG}/" ${PROG}.desktop
          sed -i -e "s/Icon=.*/Icon=${PROG}/" ${PROG}.desktop
          linuxdeploy --appdir AppDir --output appimage --desktop-file=${PROG}.desktop
        done

        # Check folder contents
        ls -la
        cd ..

        echo "======================================================================="
        ls -la build_poisson_leapfrog/bin
        echo "======================================================================="
        cd build_poisson_leapfrog

        # Declare an array of strings
        declare -a PROGS=("piclas" "superB")

        # Iterate the string array
        for PROG in ${PROGS[@]}; do
          rm -rf AppDir
          DESTDIR=AppDir ninja install
          mkdir -p AppDir/usr/share/icons
          cp ../docs/logo.png AppDir/usr/share/icons/${PROG}.png
          mkdir -p AppDir/usr/share/icons/hicolor/64x64/apps/
          ln -sf ../../../${PROG}.png AppDir/usr/share/icons/hicolor/64x64/apps/
          cp ../.github/workflows/piclas.desktop template.desktop
          mv template.desktop ${PROG}.desktop
          sed -i -e "s/Name=.*/Name=${PROG}/" ${PROG}.desktop
          sed -i -e "s/Exec=.*/Exec=${PROG}/" ${PROG}.desktop
          sed -i -e "s/Icon=.*/Icon=${PROG}/" ${PROG}.desktop
          linuxdeploy --appdir AppDir --output appimage --desktop-file=${PROG}.desktop
        done

        # Check folder contents
        ls -la
        cd ..

    - name: Create archives
      shell: bash
      run: |
        mkdir artifacts
        mkdir release-assets
        cp build_single/piclas2vtk*x86_64.AppImage piclas2vtk
        cp build_poisson_leapfrog/superB*x86_64.AppImage superB
        cp build_DSMC/piclas-*x86_64.AppImage piclasDSMC
        cp build_BGK/piclas-*x86_64.AppImage piclasBGK
        cp build_FP/piclas-*x86_64.AppImage piclasFP
        cp build_poisson_leapfrog/piclas-*x86_64.AppImage piclasLeapfrogHDG
        md5sum piclasDSMC > md5sum.txt
        md5sum piclasBGK >> md5sum.txt
        md5sum piclasFP >> md5sum.txt
        md5sum piclasLeapfrogHDG >> md5sum.txt
        md5sum piclas2vtk >> md5sum.txt
        md5sum superB >> md5sum.txt
        cat md5sum.txt
        7z a release-assets/piclas-linux64.zip piclasDSMC piclasBGK piclasFP piclasLeapfrogHDG piclas2vtk superB md5sum.txt
        ls -la release-assets
        mv piclasDSMC piclasBGK piclasFP piclasLeapfrogHDG piclas2vtk superB md5sum.txt artifacts/.
        ls -la artifacts

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: piclas-binaries-v4.3.0
        path: artifacts

    - name: Upload release asset
      if: github.event.action == 'published'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./release-assets/piclas-linux64.zip
        asset_name: piclas-linux64.zip
        asset_content_type: application/zip